name: ${COMPOSE_PROJECT_NAME:-seonjalal}

services:
  frontend:
    image: ${FE_IMAGE}:${FE_VERSION}
    container_name: seonjalal-frontend
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - service-network

  backend:
    image: ${BE_IMAGE}:${BE_VERSION}
    container_name: seonjalal-backend
    environment:
      DB_URL: jdbc:mysql://database:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    expose:
      - "${BE_PORT:-8080}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${BE_PORT:-8080}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - service-network

  database:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: seonjalal-database
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - service-network

networks:
  service-network:
    driver: bridge

volumes:
  db-data: