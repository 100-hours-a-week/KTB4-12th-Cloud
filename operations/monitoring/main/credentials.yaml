# 실제 적용 전 원본 MONITORING_PASSWORD의 길이·형식 확인 필요. 값은 저장하지 않음.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: v3-main-monitoring
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: v3-main-monitoring
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: seonjalal/v3/production/backend-runtime
        property: MONITORING_PASSWORD
