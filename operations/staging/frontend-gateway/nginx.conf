worker_processes 1;
pid /tmp/staging-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # 인증 Query·Cookie·Authorization을 로그에 남기지 않는다.
    log_format staging '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout staging;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 10m;
    resolver 10.20.0.2 valid=60s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8080;
        server_name _;
        set $static_host d3v4hrvriagxsp.cloudfront.net;
        set $backend_host internal-seonjalal-v2-staging-alb-484357475.ap-northeast-2.elb.amazonaws.com;

        # 실제 HTTPS 연결 검증을 활성화한다. 기본 CF 인증서의 낮은 최소 정책을 여기서 사용하지 않는다.
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
        proxy_cache off;

        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 'gateway-up\n';
        }
        location = /api { return 404; }
        location /api/ {
            # /api만 제거하고 Query는 유지한다. API Origin·Cookie·Authorization은 원본 그대로 전달한다.
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass https://$backend_host;
            proxy_ssl_name v2-staging.seonjalal.com;
            proxy_set_header Host seonjalal-v2-develop-runtime.tail234485.ts.net:8443;
            proxy_set_header X-Forwarded-Host seonjalal-v2-develop-runtime.tail234485.ts.net:8443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Backend /auth Cookie를 브라우저의 /api/auth 경로에서 다시 보내도록 조정한다.
            proxy_cookie_path /auth /api/auth;
            add_header Cache-Control "no-store" always;
        }
        location / {
            limit_except GET HEAD { deny all; }
            proxy_pass https://$static_host;
            proxy_ssl_name $static_host;
            proxy_set_header Host $static_host;
            # 정적 CF에 로그인 자격증명을 전달하지 않는다. API 경로에는 적용하지 않는다.
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Origin "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }
    }
}
