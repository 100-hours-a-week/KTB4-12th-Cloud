name: Validate V3 AI QA routing
on:
  pull_request:
    paths:
      - 'operations/ai-qa/**'
      - 'scripts/lib/v3_ai_qa_routing.py'
      - 'scripts/prepare-v3-ai-qa-routing.py'
      - 'scripts/test_v3_ai_qa_routing.py'
      - '.github/workflows/validate-v3-ai-qa.yml'
  push:
    branches: [main, develop, fix/131-ai-qa-routing]
    paths:
      - 'operations/ai-qa/**'
      - 'scripts/lib/v3_ai_qa_routing.py'
      - 'scripts/prepare-v3-ai-qa-routing.py'
      - 'scripts/test_v3_ai_qa_routing.py'
      - '.github/workflows/validate-v3-ai-qa.yml'
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate routing without credentials or network
        run: |
          python3 -m json.tool operations/ai-qa/service.json > /dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_v3_ai_qa_routing.py -v
