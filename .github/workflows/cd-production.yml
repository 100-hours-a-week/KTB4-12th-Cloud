name: Production CD

run-name: >-
  Deploy FE ${{ inputs.frontend_version }} / BE ${{ inputs.backend_version }}
  by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      frontend_version:
        description: Frontend image version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      backend_version:
        description: Backend image version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      change_summary:
        description: Release summary and reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seonjalal-production
  cancel-in-progress: false

env:
  FE_IMAGE: peterj0117/seonjalal-fe
  BE_IMAGE: peterj0117/seonjalal-be

jobs:
  validate-release:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend_version: ${{ steps.version.outputs.frontend_version }}
      backend_version: ${{ steps.version.outputs.backend_version }}

    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deployment must run from the main branch." >&2
            exit 1
          fi

      - name: Validate image versions
        id: version
        shell: bash
        env:
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
          BACKEND_VERSION: ${{ inputs.backend_version }}
        run: |
          set -euo pipefail

          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "${FRONTEND_VERSION}" =~ ${VERSION_PATTERN} ]]; then
            echo "Invalid frontend version: ${FRONTEND_VERSION}" >&2
            exit 1
          fi

          if [[ ! "${BACKEND_VERSION}" =~ ${VERSION_PATTERN} ]]; then
            echo "Invalid backend version: ${BACKEND_VERSION}" >&2
            exit 1
          fi

          echo "frontend_version=${FRONTEND_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "backend_version=${BACKEND_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub images
        shell: bash
        env:
          FRONTEND_VERSION: ${{ steps.version.outputs.frontend_version }}
          BACKEND_VERSION: ${{ steps.version.outputs.backend_version }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${FE_IMAGE}:${FRONTEND_VERSION}"
          docker buildx imagetools inspect "${BE_IMAGE}:${BACKEND_VERSION}"

      - name: Record release request
        shell: bash
        env:
          FRONTEND_VERSION: ${{ steps.version.outputs.frontend_version }}
          BACKEND_VERSION: ${{ steps.version.outputs.backend_version }}
          CHANGE_SUMMARY: ${{ inputs.change_summary }}
        run: |
          {
            echo "## Production release request"
            echo
            echo "- Frontend: \`${FE_IMAGE}:${FRONTEND_VERSION}\`"
            echo "- Backend: \`${BE_IMAGE}:${BACKEND_VERSION}\`"
            echo "- Requested by: \`${GITHUB_ACTOR}\`"
            echo "- Summary: ${CHANGE_SUMMARY}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-production:
    name: Deploy to production EC2
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.PROD_AWS_ROLE_ARN }}
      AWS_DEPLOY_REGION: ${{ vars.PROD_AWS_REGION }}
      INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/opt/seonjalal' }}
      PUBLIC_BASE_URL: ${{ vars.PROD_BASE_URL }}
      READ_ONLY_SMOKE_PATH: ${{ vars.PROD_READ_ONLY_SMOKE_PATH || '/api/products' }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_ROLE_ARN:?PROD_AWS_ROLE_ARN variable is required}"
          : "${AWS_DEPLOY_REGION:?PROD_AWS_REGION variable is required}"
          : "${INSTANCE_ID:?PROD_EC2_INSTANCE_ID variable is required}"
          : "${DEPLOY_PATH:?PROD_DEPLOY_PATH variable is required}"
          : "${PUBLIC_BASE_URL:?PROD_BASE_URL variable is required}"

          if [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::721744297924:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "PROD_AWS_ROLE_ARN must reference an IAM role in the production AWS account." >&2
            exit 1
          fi

          if [[ "${AWS_DEPLOY_REGION}" != "ap-northeast-2" ]]; then
            echo "PROD_AWS_REGION must be ap-northeast-2." >&2
            exit 1
          fi

          if [[ ! "${INSTANCE_ID}" =~ ^i-[a-f0-9]{8,17}$ ]]; then
            echo "PROD_EC2_INSTANCE_ID is invalid." >&2
            exit 1
          fi

          if [[ ! "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ || "${DEPLOY_PATH}" == *".."* ]]; then
            echo "PROD_DEPLOY_PATH must be an absolute path without traversal segments." >&2
            exit 1
          fi

          if [[ ! "${PUBLIC_BASE_URL}" =~ ^https:// ]]; then
            echo "PROD_BASE_URL must use HTTPS." >&2
            exit 1
          fi

          if [[ ! "${READ_ONLY_SMOKE_PATH}" =~ ^/ ]]; then
            echo "PROD_READ_ONLY_SMOKE_PATH must start with /." >&2
            exit 1
          fi

      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEPLOY_REGION }}
          role-session-name: seonjalal-production-cd
          allowed-account-ids: "721744297924"

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Deploy and verify release through SSM
        shell: bash
        env:
          FRONTEND_VERSION: ${{ needs.validate-release.outputs.frontend_version }}
          BACKEND_VERSION: ${{ needs.validate-release.outputs.backend_version }}
        run: |
          set -euo pipefail

          ./scripts/deploy-production-via-ssm.sh \
            "${INSTANCE_ID}" \
            "${DEPLOY_PATH}" \
            "${FRONTEND_VERSION}" \
            "${BACKEND_VERSION}" \
            "${PUBLIC_BASE_URL}" \
            "${READ_ONLY_SMOKE_PATH}"
