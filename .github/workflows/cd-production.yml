# ==============================================================================
# V1 운영(EC2 + Docker Compose) 수동 배포 워크플로 - Legacy 복구 경로
# ------------------------------------------------------------------------------
# 역할
#   - Docker Hub에 올라간 FE/BE 이미지 버전을 지정해 V1 운영 EC2에 배포한다.
#     V2(ECS/S3) 배포는 cd-v2.yml. 이 파일은 V2 전환 전 수동 복구용으로 보존 중.
# 트리거
#   - workflow_dispatch(수동)만. main 브랜치에서만 실행 가능.
# 입력 -> 출력
#   - 입력: frontend_version, backend_version (MAJOR.MINOR.PATCH), 변경 사유.
#   - 출력: 운영 EC2의 frontend/backend 컨테이너가 해당 버전으로 교체됨.
# 전체 흐름
#   1) validate-release: main 확인 -> 버전 형식 검증 -> Docker Hub에 이미지 존재 확인
#      -> 요청 내용을 Step Summary에 기록 (AWS 접근 없음)
#   2) deploy-production: 변수 검증 -> OIDC로 AWS Role Assume -> SSM Run Command로
#      EC2에서 scripts/deploy-production.sh 실행(scripts/deploy-production-via-ssm.sh 경유)
#      -> 헬스체크/스모크 테스트
# 실패 시 동작
#   - 1단계 실패: 아무것도 배포되지 않음.
#   - 2단계 실패: EC2 쪽 스크립트가 직전 릴리스로 자동 롤백을 시도하고, 워크플로는
#     (롤백 성공 여부와 무관하게) 실패로 남겨 원인 조사를 유도한다.
# 주의
#   - GitHub Environment 승인 게이트(environment:)가 이 파일에는 없다.
# ==============================================================================
name: Legacy V1 Production CD

# V1 운영 전환 전 수동 복구 경로 보존. V2 배포는 cd-v2.yml 사용.

run-name: >-
  Deploy FE ${{ inputs.frontend_version }} / BE ${{ inputs.backend_version }}
  by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      frontend_version:
        description: Frontend image version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      backend_version:
        description: Backend image version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      change_summary:
        description: Release summary and reason
        required: true
        type: string

permissions:
  contents: read

# 운영 배포는 동시에 1개만. 진행 중인 배포는 취소하지 않고 대기(반쯤 교체된 상태 방지).
concurrency:
  group: seonjalal-production
  cancel-in-progress: false

env:
  # Docker Hub 이미지 이름(레지스트리 계정 포함). 태그는 입력받은 버전.
  # V2는 ECR 불변 태그+digest 고정을 쓰지만, 이 V1 경로는 Docker Hub 태그를 그대로 사용한다(태그 불변성은 이 코드로 통제되지 않음).
  FE_IMAGE: peterj0117/seonjalal-fe
  BE_IMAGE: peterj0117/seonjalal-be

jobs:
  # [1단계] AWS 자격증명 없이 "요청이 유효한지"만 확인. 여기서 걸러지면 운영에 아무 영향 없음.
  # outputs로 검증된 버전만 2단계로 넘긴다.
  validate-release:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend_version: ${{ steps.version.outputs.frontend_version }}
      backend_version: ${{ steps.version.outputs.backend_version }}

    steps:
      # main이 아닌 브랜치의 워크플로 정의로 운영 배포가 시작되는 것을 차단.
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deployment must run from the main branch." >&2
            exit 1
          fi

      # 입력값은 env로 받아 정규식 검증 후에만 output으로 전달(쉘 인젝션 방지).
      # 예: 1.2.3 형식만 허용. 접미사(-rc 등)는 허용하지 않는다.
      - name: Validate image versions
        id: version
        shell: bash
        env:
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
          BACKEND_VERSION: ${{ inputs.backend_version }}
        run: |
          set -euo pipefail

          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "${FRONTEND_VERSION}" =~ ${VERSION_PATTERN} ]]; then
            echo "Invalid frontend version: ${FRONTEND_VERSION}" >&2
            exit 1
          fi

          if [[ ! "${BACKEND_VERSION}" =~ ${VERSION_PATTERN} ]]; then
            echo "Invalid backend version: ${BACKEND_VERSION}" >&2
            exit 1
          fi

          echo "frontend_version=${FRONTEND_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "backend_version=${BACKEND_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # imagetools inspect = 이미지를 pull하지 않고 레지스트리에 해당 태그가 존재하는지만 확인.
      # 없는 버전을 운영 EC2에 내려받게 하는 실수를 사전에 차단. (digest 고정은 하지 않음)
      - name: Verify Docker Hub images
        shell: bash
        env:
          FRONTEND_VERSION: ${{ steps.version.outputs.frontend_version }}
          BACKEND_VERSION: ${{ steps.version.outputs.backend_version }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${FE_IMAGE}:${FRONTEND_VERSION}"
          docker buildx imagetools inspect "${BE_IMAGE}:${BACKEND_VERSION}"

      # 누가 어떤 버전을 왜 배포했는지 실행 요약 페이지에 남긴다(감사 목적, 비밀 정보 없음).
      - name: Record release request
        shell: bash
        env:
          FRONTEND_VERSION: ${{ steps.version.outputs.frontend_version }}
          BACKEND_VERSION: ${{ steps.version.outputs.backend_version }}
          CHANGE_SUMMARY: ${{ inputs.change_summary }}
        run: |
          {
            echo "## Production release request"
            echo
            echo "- Frontend: \`${FE_IMAGE}:${FRONTEND_VERSION}\`"
            echo "- Backend: \`${BE_IMAGE}:${BACKEND_VERSION}\`"
            echo "- Requested by: \`${GITHUB_ACTOR}\`"
            echo "- Summary: ${CHANGE_SUMMARY}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # [2단계] 실제 운영 변경. validate-release 통과 시에만 실행.
  # id-token: write = GitHub OIDC로 AWS Role을 Assume하기 위한 권한(장기 Access Key 미사용).
  deploy-production:
    name: Deploy to production EC2
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # vars.PROD_* 는 GitHub 저장소/환경 변수(비밀 아님). DEPLOY_PATH와 스모크 경로만 기본값이 있고,
    # 나머지는 비어 있으면 다음 단계에서 실패한다.
    env:
      AWS_ROLE_ARN: ${{ vars.PROD_AWS_ROLE_ARN }}
      AWS_DEPLOY_REGION: ${{ vars.PROD_AWS_REGION }}
      INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/opt/seonjalal' }}
      PUBLIC_BASE_URL: ${{ vars.PROD_BASE_URL }}
      READ_ONLY_SMOKE_PATH: ${{ vars.PROD_READ_ONLY_SMOKE_PATH || '/api/products' }}

    steps:
      # AWS 호출 전에 설정값 형식을 엄격히 검사. 잘못된 변수(다른 계정 Role, 다른 리전, 경로 조작,
      # HTTP URL)로 운영을 건드리는 사고를 막는다. 부작용 없음.
      # # 확인 필요: DEPLOY_PATH는 기본값('/opt/seonjalal')이 항상 채워져 아래 :? 검사는 사실상 도달하지 않음(의도된 이중 방어인지)
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_ROLE_ARN:?PROD_AWS_ROLE_ARN variable is required}"
          : "${AWS_DEPLOY_REGION:?PROD_AWS_REGION variable is required}"
          : "${INSTANCE_ID:?PROD_EC2_INSTANCE_ID variable is required}"
          : "${DEPLOY_PATH:?PROD_DEPLOY_PATH variable is required}"
          : "${PUBLIC_BASE_URL:?PROD_BASE_URL variable is required}"

          if [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::721744297924:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "PROD_AWS_ROLE_ARN must reference an IAM role in the production AWS account." >&2
            exit 1
          fi

          if [[ "${AWS_DEPLOY_REGION}" != "ap-northeast-2" ]]; then
            echo "PROD_AWS_REGION must be ap-northeast-2." >&2
            exit 1
          fi

          if [[ ! "${INSTANCE_ID}" =~ ^i-[a-f0-9]{8,17}$ ]]; then
            echo "PROD_EC2_INSTANCE_ID is invalid." >&2
            exit 1
          fi

          if [[ ! "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ || "${DEPLOY_PATH}" == *".."* ]]; then
            echo "PROD_DEPLOY_PATH must be an absolute path without traversal segments." >&2
            exit 1
          fi

          if [[ ! "${PUBLIC_BASE_URL}" =~ ^https:// ]]; then
            echo "PROD_BASE_URL must use HTTPS." >&2
            exit 1
          fi

          if [[ ! "${READ_ONLY_SMOKE_PATH}" =~ ^/ ]]; then
            echo "PROD_READ_ONLY_SMOKE_PATH must start with /." >&2
            exit 1
          fi

      # EC2로 보낼 scripts/deploy-production.sh와 SSM 래퍼를 가져온다.
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      # [보안] OIDC로 운영 Role Assume. allowed-account-ids로 의도한 계정이 아니면 실패.
      # 확인 필요: 이 Role에 부여된 권한 범위와 신뢰 정책(이 저장소/브랜치 제한 여부)의 정의 위치
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEPLOY_REGION }}
          role-session-name: seonjalal-production-cd
          allowed-account-ids: "721744297924"

      # 현재 어떤 Role/계정으로 동작 중인지 로그에 남겨 감사·디버깅에 쓴다(읽기 전용).
      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      # [핵심 단계] SSH 대신 SSM Run Command로 운영 EC2에서 배포 스크립트를 실행한다
      # (22번 포트/키 불필요). 래퍼는 SSM 실행 결과(성공/실패)를 이 단계의 종료 코드로 변환한다.
      # 배포 -> 헬스체크 -> 외부 경로 스모크 테스트 -> 실패 시 롤백까지 EC2 쪽 스크립트가 담당.
      - name: Deploy and verify release through SSM
        shell: bash
        env:
          FRONTEND_VERSION: ${{ needs.validate-release.outputs.frontend_version }}
          BACKEND_VERSION: ${{ needs.validate-release.outputs.backend_version }}
        run: |
          set -euo pipefail

          ./scripts/deploy-production-via-ssm.sh \
            "${INSTANCE_ID}" \
            "${DEPLOY_PATH}" \
            "${FRONTEND_VERSION}" \
            "${BACKEND_VERSION}" \
            "${PUBLIC_BASE_URL}" \
            "${READ_ONLY_SMOKE_PATH}"
