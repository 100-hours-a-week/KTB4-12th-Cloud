
# ==============================================================================
# V2 릴리스 배포 워크플로 (현행 배포 경로. V1 EC2 경로는 cd-production.yml)
# ------------------------------------------------------------------------------
# 역할
#   - 이미 ECR에 게시된 BE 릴리스 이미지(ECS Service)를
#     사람이 버전을 지정해 수동으로 배포한다. 실제 배포 로직은 전부
#     scripts/deploy-v2-release.py가 수행하고, 이 파일은 "안전 게이트 + AWS 인증
#     + 스크립트 호출 + 영수증 업로드"만 담당한다.
# 트리거
#   - workflow_dispatch(수동)만 존재. 자동 배포 없음. main 브랜치에서만 동작.
#   - dry_run 기본값이 true. 체크를 해제해야만 실제 AWS 변경(--apply)이 일어난다.
# 입력 -> 출력
#   - 입력: 대상 환경(staging/production), BE 버전,
#     BE 레이아웃(split-v2 | legacy-v1), 호환성 검토 체크, dry_run, 변경 사유.
#   - 출력: ECS Task Definition 새 revision + Service 갱신(--apply일 때만),
#     그리고 receipt.json 아티팩트(항상 시도).
#   - FE는 이 워크플로 대상이 아니다. FE 저장소가 main 머지 시 S3+CloudFront로 자동 배포한다.
#     AI는 Terraform(production/ai-runtime) 경로이며 이 워크플로 대상이 아니다.
# 전체 흐름 (job 1개: deliver)
#   1) 사전 게이트: main 여부, V2_CD_READY, 배포 Role 이름, Task Definition 소유권,
#      (production) Environment 승인자 존재 여부 확인 -> AWS 자격증명 발급 전에 중단
#   2) checkout -> OIDC로 환경 전용 Role Assume
#   3) deploy-v2-release.py 실행: 전 대상 검증(dry-run 포함) 후 --apply면 배포
#   4) 성공/실패와 무관하게 receipt.json 업로드(30일 보관)
# 실패 시 동작
#   - 사전 게이트/검증 실패: AWS 변경 없이 종료.
#   - 배포 도중 실패: 스크립트가 앱(ECS revision)을 이전 상태로
#     자동 복구 시도. DB 스키마는 자동 복구하지 않는다(스크립트 주석 참고).
#   - 자동 복구도 실패하면 receipt.json의 rollback 필드에 수동 개입 필요가 기록됨.
# ==============================================================================
name: V2 Release Delivery
# Actions 목록에서 어떤 환경/구성요소/버전을 배포한 실행인지 바로 보이게 한다.
run-name: V2 ${{ inputs.target_environment }} / BE ${{ inputs.backend_version }}

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 배포 대상 — 운영은 GitHub Environment 승인 필수
        required: true
        type: choice
        options: [staging, production]
      backend_version:
        description: BE 릴리스 버전 (예 2.0.0)
        required: true
        type: string
      backend_layout:
        description: V1 단일 BE 이전 시험 / V2 Main·Payment 분리
        type: choice
        options: [split-v2, legacy-v1]
        default: split-v2
      compatibility_reviewed:
        description: 신구 API·결제 통신 및 DB 스키마 호환성 검토 완료
        type: boolean
        default: false
      dry_run:
        description: 검증·계획만 수행 (실제 배포하려면 해제)
        type: boolean
        default: true
      change_summary:
        description: 변경 사유와 검증 근거
        type: string
        required: true

# 워크플로 기본 권한은 읽기 전용. OIDC(id-token)가 필요한 job만 아래에서 따로 올린다.
permissions:
  contents: read

# 같은 환경(staging 또는 production)에 대한 배포는 동시에 1개만 실행한다.
# cancel-in-progress: false = 진행 중인 배포를 취소하지 않고 뒤 실행을 대기시킨다
# (배포 중간 취소로 ECS가 반쯤 바뀐 상태가 되는 것을 방지).
concurrency:
  group: seonjalal-v2-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  # 단일 job. environment(v2-staging / v2-production)를 걸어 환경별 변수·승인 규칙을 적용한다.
  # production은 이 Environment의 Required reviewers 승인 후에야 job이 시작된다.
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: v2-${{ inputs.target_environment }}
    permissions:
      contents: read
      # id-token: write = GitHub OIDC 토큰 발급 허용. 장기 Access Key 대신 단기 자격증명으로
      # AWS Role을 Assume하기 위한 것. (환경 전용 Role의 신뢰 정책이 이 저장소/환경만 허용하는지는
      # Terraform 쪽 설정이며 이 파일에서는 확인할 수 없음)
      # 확인 필요: deployments: read / actions: read 권한이 실제로 쓰이는 지점(코드상 gh api 호출 외 사용처 불명)
      id-token: write
      deployments: read
      actions: read
    # 스크립트 인자/게이트에 쓰는 값. 사용자 입력(inputs.*)은 run 스크립트에 ${{ }}로 직접
    # 끼워 넣지 않고 env로 전달한다(스크립트 인젝션 방지).
    # vars.*는 GitHub Environment 변수(비밀 아님). Secret은 이 워크플로에서 사용하지 않는다.
    # 확인 필요: V2_TASK_DEFINITION_OWNER=cd 의미(Terraform이 Task Definition을 CD에 넘겼다는 표시로 추정, 코드는 값 비교만 함)
    # 확인 필요: CHANGE_SUMMARY는 env로만 전달되며 이후 단계/스크립트에서 사용처를 찾지 못함(감사 기록 목적으로 추정)
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      BACKEND_VERSION: ${{ inputs.backend_version }}
      BACKEND_LAYOUT: ${{ inputs.backend_layout }}
      COMPATIBILITY_REVIEWED: ${{ inputs.compatibility_reviewed }}
      DRY_RUN: ${{ inputs.dry_run }}
      V2_CD_READY: ${{ vars.V2_CD_READY }}
      V2_TASK_DEFINITION_OWNER: ${{ vars.V2_TASK_DEFINITION_OWNER }}
      V2_DEPLOY_ROLE_ARN: ${{ vars.V2_DEPLOY_ROLE_ARN }}
      GH_TOKEN: ${{ github.token }}
      CHANGE_SUMMARY: ${{ inputs.change_summary }}
      AWS_REGION: ap-northeast-2

    steps:
      # [게이트] AWS 자격증명을 받기 전에 "잘못된 곳에서/미준비 상태로" 실행되는 것을 차단한다.
      # 부작용 없음(읽기/검사만).
      - name: Require configured V2 environment and production approval rule
        shell: bash
        run: |
          set -euo pipefail
          # main 외 코드·미구성 환경에서 AWS 자격증명 발급 전 중단.
          # main 브랜치가 아니면 즉시 실패(set -e). 임의 브랜치 코드로 운영 Role을 쓰지 못하게 함.
          test "$GITHUB_REF" = refs/heads/main
          test "$V2_CD_READY" = true || { echo 'V2_CD_READY 설정 전에는 배포할 수 없습니다.' >&2; exit 1; }
          # 환경 변수에 다른 Role(예: staging 변수에 production Role)이 들어가는 설정 실수를 방지.
          # Role 이름이 환경별로 고정된 규칙(seonjalal-v2-<env>-release-deployer)과 일치해야 통과.
          test "$V2_DEPLOY_ROLE_ARN" = "arn:aws:iam::721744297924:role/seonjalal-v2-${TARGET_ENVIRONMENT}-release-deployer"
          # Task Definition을 CD가 소유해야 한다. Terraform과 CD가 같은 Task
          # Definition을 서로 덮어쓰는 충돌을 막기 위한 선행 조건.
          test "$V2_TASK_DEFINITION_OWNER" = cd || { echo 'Terraform/CD 배포 소유권 정렬이 먼저 필요합니다.' >&2; exit 1; }
          # production만 실제 승인 규칙 존재를 API로 재확인한다(위 주석대로 YAML 선언만으론 승인이 안 생김).
          if [[ "$TARGET_ENVIRONMENT" == production ]]; then
            # YAML environment 선언만으로 승인이 생기지 않으므로 실제 보호 규칙도 검사.
            REVIEWERS=$(gh api "repos/$GITHUB_REPOSITORY/environments/v2-production" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
            test "$REVIEWERS" -gt 0 || { echo '운영 Environment에 Required reviewers를 설정해야 합니다.' >&2; exit 1; }
          fi

      # 배포 스크립트(scripts/deploy-v2-release.py)를 가져온다. 게이트 통과 후에 수행.
      - name: Check out Cloud deployment code
        uses: actions/checkout@v4

      # [보안] OIDC로 환경 전용 배포 Role을 Assume. allowed-account-ids는 의도한 AWS 계정이
      # 아니면 즉시 실패시키는 이중 안전장치. role-session-name으로 CloudTrail에서 환경별 추적 가능.
      - name: Configure environment-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.V2_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '721744297924'
          role-session-name: v2-${{ inputs.target_environment }}-delivery

      # [핵심 단계] 배포 본체. 스크립트는 (a) 모든 대상의 검증을 먼저 끝내고 (b) --apply가 있을 때만
      # 등록/갱신/업로드를 수행한다. dry_run(기본 true)이면 --apply가 붙지 않아 AWS 변경이 차단되며
      # ECR/ECS 조회만 일어난다.
      # DRY_RUN은 문자열 비교이며 false일 때만 --apply 추가.
      # 스테이트 디렉터리는 새로 만들 전용 경로여야 하며(스크립트가 존재하면 거부) 러너 임시 폴더를 사용.
      - name: Validate all targets before deploying pinned release
        shell: bash
        run: |
          set -euo pipefail
          APPLY_ARGS=()
          if [[ "$DRY_RUN" == false ]]; then APPLY_ARGS+=(--apply); fi
          python3 scripts/deploy-v2-release.py \
            --environment "$TARGET_ENVIRONMENT" \
            --component backend \
            --backend-version "$BACKEND_VERSION" \
            --backend-layout "$BACKEND_LAYOUT" \
            --compatibility-reviewed "$COMPATIBILITY_REVIEWED" \
            --state-dir "$RUNNER_TEMP/v2-delivery" \
            "${APPLY_ARGS[@]}"

      # if: always() = 앞 단계 실패에도 업로드. receipt.json에는 서비스명/이전·신규 Task Definition/
      # 이미지 참조/롤백 결과가 담긴다(Secret 아님, 단 ARN·레지스트리 주소 포함).
      # 배포 실패 원인과 "수동 복구가 필요한지"를 여기서 확인한다. 검증 전 단계에서 실패하면 파일이 없을 수 있어 ignore.
      - name: Upload non-secret deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-delivery-${{ inputs.target_environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-delivery/receipt.json
          if-no-files-found: ignore
          retention-days: 30
