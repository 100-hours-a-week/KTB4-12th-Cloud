# 아직 출시용 활성화 파일이 아닙니다. 이미지/스키마 확인 후 서비스별로 기동합니다.
replicas: 0
database:
  # V3.0.1 필수 16개 적용·신규 테이블 앱 DML 권한 확인. V45/V46은 V2 종료 후 별도 적용.
  schemaReviewed: true
image:
  repository: 721744297924.dkr.ecr.ap-northeast-2.amazonaws.com/seonjalal/production/backend
env:
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2
  AWS_STS_REGIONAL_ENDPOINTS: regional
  AWS_EC2_METADATA_DISABLED: "true"
  DB_URL: jdbc:mysql://seonjalal-v2-production.cbqckkusw4ke.ap-northeast-2.rds.amazonaws.com:3306/seonjalal?sslMode=VERIFY_IDENTITY
  DB_USERNAME: seonjalal_production_app
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_SQL_INIT_MODE: never
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 45s
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # 기본 12 Pod × 최대5연결 = 60. V2/AI 등 연결은 별도 합산하며 DB 상한 확인 후 기동.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
