{{- if .Values.monitoring.enabled }}
{{- include "backend.validate" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backend.name" . }}-monitoring
  namespace: {{ .Release.Namespace }}
  annotations:
    # 관리 포트를 열 새 Deployment보다 접근 정책을 먼저 적용.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "backend.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # 기존 앱 8080 접근 계약 유지. 공개 ALB·probe·내부 호출을 제한하지 않음.
    - ports:
        - {protocol: TCP, port: 8080}
    # namespaceSelector를 생략해 같은 namespace의 수집기만 허용.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: v3-metrics-agent
      ports:
        - {protocol: TCP, port: 8081}
{{- end }}
