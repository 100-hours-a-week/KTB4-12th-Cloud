{{- range $role := list "chat" "profiler" }}
{{- $service := index $.Values.services $role }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  labels:
    {{- include "ai.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai.labels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: {{ $role }}
{{- end }}
